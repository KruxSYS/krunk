[package]
name = "framecap"
description = "Test tool: records every composed frame of a screen region (VM evidence for tab switches and animations)"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# A test tool for the Windows VM (scripts/frames/), not part of the browser workspace.
[workspace]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = 3
