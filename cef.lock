# CEF binary distribution used by Krunk (read by scripts/fetch-cef.sh).
#
# Since 0.5.2 the engine is Krunk's own build of CEF with proprietary codecs (H.264, HEVC,
# AAC, AC-3/E-AC-3): same CEF commit and Chromium tag as the Spotify "minimal" build, so the
# `cef` crate pin in app/Cargo.toml is unchanged. How it is built: scripts/cef-build/README.md.
# The archive is not downloaded: copy it from CEF_ARTIFACT into ~/.cache/krunk-cef/downloads/;
# fetch-cef.sh checks the SHA-256 and exports it.
#
# To move to a newer CEF: bump the `cef` crate pin in app/Cargo.toml, rebuild the engine with
# scripts/cef-build/cross-build.sh (or, for a stock Spotify build, set CEF_SOURCE=spotify and
# CEF_SHA1 from https://cef-builds.spotifycdn.com/index.json), update these values, run
# `scripts/fetch-cef.sh --pin` to record the SHA-256, then `scripts/build-dist.sh --release`.
CEF_CRATE=156.3.0+156.0.15
CEF_VERSION=156.0.15
CHROMIUM_VERSION=156.0.8078.80
CEF_SOURCE=self-built
CEF_ARCHIVE=cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_windows64_minimal_krunk-codecs-hidden-brand-private-nav.tar.bz2
CEF_SHA256=30f00b4c740e8d83bb5e52fe71f4a1ff0acdfb2e36592ae6fd6b35b95bd8b23f
# Where the archive is kept (outside git, with the release artifacts): the pipeline's artifact
# store and the GitHub release of 0.12.3 (dist/). 0.5.2-0.9.0 shipped the unpatched ..._krunk-codecs
# archive (a8bb5c42…), 0.10.0-0.12.0 ..._krunk-codecs-hidden (5aab8496…), 0.12.1-0.12.2
# ..._krunk-codecs-hidden-brand (29d97fa8…).
CEF_ARTIFACT=/work/projects/extra/browser/.pipeline/artifacts/cef/cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_windows64_minimal_krunk-codecs-hidden-brand-private-nav.tar.bz2
# Build inputs: CEF cf671c0, Chromium tag 156.0.8078.80, Linux->Windows cross build, GN args in
# scripts/cef-build/cross-build.sh (is_official_build proprietary_codecs ffmpeg_branding=Chrome
# enable_platform_hevc enable_platform_ac3_eac3_audio), MSVC 14.51.36231 / SDK 10.0.28000.0.
# Krunk's CEF patches (0.10.0), applied by cross-build.sh build:
#   scripts/cef-build/patches/krunk-windowed-hidden.patch
#     sha256 86e46b0042bc18de8cd385124ce3623bbea1a18f7f9c8737c2000451d3c7f14b
#     background tabs are hidden from the engine (throttled like Chrome's); libcef.dll d9f4549b…
# Krunk's logo (0.12.1, cross-build.sh brand): assets/brand/krunk-256.png replaces Chromium's
#   product_logo_256.png, the artwork of the Windows media overlay when a site gives none. Only
#   resources.pak changes (dd784546…); libcef.dll stays d9f4549b….
#   scripts/cef-build/patches/chromium-private-media.patch (0.12.3, applied to the Chromium checkout)
#     sha256 1316748dc6ffb7d76d16aa02b3c8d4de7e9f4c102dd2565f42332c04e52452d6
#     media of private tabs never reaches Windows' media controls (Now Playing); libcef.dll aefc93eb…
#   scripts/cef-build/patches/chromium-clone-navigation.patch (0.18.0, Chromium checkout)
#     sha256 e70936d42a179a5f7ad56f378a11c838284f73d708e066833f3e7b63e477d5a0
#     DevTools command Page.krunkCloneNavigationFrom: a new tab takes another tab's back/forward list
#   scripts/cef-build/patches/chromium-sockets-per-host.patch (0.18.0, Chromium checkout)
#     sha256 1b6061d9d90a43c466f51aabe8ca06b396bfb98ac05c561b98b8983e68aa811c
#     16 instead of 6 connections per host. Archive ..._krunk-codecs-hidden-brand-private-nav
#     (30f00b4c…), libcef.dll 8e5cc766…; 0.12.3-0.17.0 shipped ...-private (d406d15a…, libcef aefc93eb…).
#     Built in .pipeline/cef-build (another path than the earlier builds): chrome_elf.dll,
#     dxcompiler.dll, vk_swiftshader.dll and vulkan-1.dll differ from the earlier engine in 8 bytes
#     each, and nothing else: bytes 4-11 of the CodeView record ("RSDS") in the PE debug
#     directory, i.e. the first half of the PDB GUID the linker derives from the PDB's contents
#     (which hold the build tree's paths); the second half is lld's constant "LLD PDB.". Checked
#     0.19.0 by a byte diff of all four (same size, same code, same timestamps, same checksum).
#     resources.pak differs by the new protocol command.
CEF_PATCHES="krunk-windowed-hidden.patch:86e46b0042bc18de8cd385124ce3623bbea1a18f7f9c8737c2000451d3c7f14b chromium-private-media.patch:1316748dc6ffb7d76d16aa02b3c8d4de7e9f4c102dd2565f42332c04e52452d6 chromium-clone-navigation.patch:e70936d42a179a5f7ad56f378a11c838284f73d708e066833f3e7b63e477d5a0 chromium-sockets-per-host.patch:1b6061d9d90a43c466f51aabe8ca06b396bfb98ac05c561b98b8983e68aa811c"
