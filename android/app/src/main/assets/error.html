<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>
  /* Krunk's palette (ui/shared/common.css) */
  :root { --bg:#f3f4f6; --bg-raised:#fff; --fg:#1f2937; --fg-muted:#6b7280; --border:#d1d5db; --accent:#2563eb; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f2023; --bg-raised:#2b2d31; --fg:#e5e7eb; --fg-muted:#9ca3af; --border:#44474e; --accent:#60a5fa; --accent-fg:#0b1220; }
  }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 12vh auto 0; padding: 0 24px; }
  .logo { width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,#ff6a3d,#c2185b); display:flex; align-items:center; justify-content:center; margin-bottom:24px; }
  .logo svg { width:36px; height:36px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { margin:0 0 12px; color:var(--fg-muted); }
  code { display:block; word-break:break-all; background:var(--bg-raised); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13px; color:var(--fg); margin:16px 0; }
  .code { font-size:12px; color:var(--fg-muted); }
  button { font:inherit; font-weight:600; background:var(--accent); color:var(--accent-fg); border:0; border-radius:8px; padding:12px 20px; margin-top:8px; }
  button.secondary, a.button.secondary { background:transparent; color:var(--accent); border:1px solid var(--border); margin-left:8px; }
  a.button { display:inline-block; font:inherit; font-weight:600; text-decoration:none; border-radius:8px; padding:12px 20px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 256 256"><rect x="62" y="50" width="44" height="156" rx="10" fill="#fff"/><path d="M106 128 L160 50 L208 50 L144 128 Z" fill="#fff"/><path d="M128 140 L154 116 L212 206 L162 206 Z" fill="#fff"/></svg>
  </div>
  <h1>{{title}}</h1>
  <p>{{message}}</p>
  <code>{{url}}</code>
  {{buttons}}
  <p class="code">{{code}}</p>
</main>
</body>
</html>
