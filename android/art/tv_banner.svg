<?xml version="1.0" encoding="UTF-8"?>
<!-- Android TV launcher banner (320x180 xhdpi) in the KruxSYS look: the Krunk icon
     (assets/brand/krunk.svg, 2026-11-24 version), the name and "by KruxSYS" on KruxSYS's dark
     field. Rendered to res/drawable-xhdpi/tv_banner.png by make-banner.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1a212c" stroke-width="1"/>
    </pattern>
    <linearGradient id="crunch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="#07090c"/>
  <rect width="320" height="180" fill="url(#grid)"/>
  <g transform="translate(26 42) scale(0.375)">
    <rect x="12" y="12" width="232" height="232" fill="#0c1016" stroke="#2a3442" stroke-width="8"/>
    <path d="M12 76V12h64M180 244h64v-64" fill="none" stroke="#22d3ee" stroke-width="12"/>
    <rect x="66" y="56" width="40" height="144" fill="#e8ecf2"/>
    <path d="M106 128 156 56h44l-58 72Z" fill="#e8ecf2"/>
    <path d="M126 140 150 118l52 82h-46Z" fill="url(#crunch)"/>
  </g>
  <text x="132" y="100" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="50" fill="#e8ecf2">Krunk</text>
  <text x="134" y="126" font-family="DejaVu Sans Mono, monospace" font-size="12" letter-spacing="2" fill="#8e9bb0">BY KRUX<tspan fill="#22d3ee">SYS</tspan></text>
</svg>
