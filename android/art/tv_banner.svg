<?xml version="1.0" encoding="UTF-8"?>
<!-- Android TV launcher banner (320x180 xhdpi): the Krunk logo (assets/brand/krunk.svg) and the
     name on a dark card. Rendered to res/drawable-xhdpi/tv_banner.png by make-banner.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1420"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#card)"/>
  <g transform="translate(26 42) scale(0.375)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
    <rect x="62" y="50" width="44" height="156" rx="10" fill="#fff"/>
    <path d="M106 128 L160 50 L208 50 L144 128 Z" fill="#fff"/>
    <path d="M128 140 L154 116 L212 206 L162 206 Z" fill="#fff"/>
  </g>
  <text x="132" y="108" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="50" fill="#ffffff">Krunk</text>
</svg>
