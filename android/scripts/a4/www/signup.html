<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>signup</title>
<style>input,button{font-size:22px;display:block;margin:14px 0;width:90%;padding:10px}</style>
<h3>Create account</h3>
<form method=post action=/post><input id=u name=email type=email autocomplete=username placeholder=email>
<input id=p name=password type=password autocomplete=new-password placeholder=password>
<input id=c name=confirm type=password autocomplete=new-password placeholder=confirm>
<button id=s>Create account</button></form>
<div id=o>u= p= c=</div>
<!-- Android 0.13.0: the suggested password must land in both fields; the values are shown for the device tests. -->
<script>setInterval(()=>{const t='u='+u.value+' p='+p.value+' c='+c.value;if(o.textContent!==t)o.textContent=t},400)</script>
