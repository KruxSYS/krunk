# Standalone use: publish Caddy's ports on this host.
#   docker compose -f compose.yaml -f compose.ports.yaml up -d --build
# With SITE_ADDRESS set to a domain, use HTTP_PORT=80 and HTTPS_PORT=443 (see .env.example).
services:
  web:
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
