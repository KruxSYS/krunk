<?xml version="1.0" encoding="UTF-8"?>
<!-- Krunk logo: a bold "K" whose arms meet at a chevron, on a rounded square.
     Source of krunk.ico and the PNGs (see make-icons.sh). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
  <!-- stem -->
  <rect x="62" y="50" width="44" height="156" rx="10" fill="#fff"/>
  <!-- upper arm -->
  <path d="M106 128 L160 50 L208 50 L144 128 Z" fill="#fff"/>
  <!-- lower arm, slightly offset: the "crunch" -->
  <path d="M128 140 L154 116 L212 206 L162 206 Z" fill="#fff"/>
</svg>
