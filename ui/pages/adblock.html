<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ad blocking</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="shared/page.css">
<link rel="stylesheet" href="adblock.css">
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>Ad blocking</h1>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab-btn" role="tab" id="tab-blocked" data-panel="blocked" aria-selected="true">Blocked on this page</button>
  </div>

  <section id="blocked" class="panel" role="tabpanel">
    <div class="toolbar">
      <p id="summary" class="muted"></p>
      <input id="search" class="search" type="search" placeholder="Search addresses and filters" aria-label="Search blocked addresses" spellcheck="false">
      <button id="refresh" class="btn">Refresh</button>
    </div>
    <div id="list" class="card"></div>
    <p class="muted note">Requests the ad blocker stopped on the page, newest first, with the filter that matched and
      the list it comes from. Addresses are shown without their query. This list lives only in memory and starts again
      when the page navigates. Elements hidden by cosmetic filters are not listed.</p>
  </section>
</div>
<script src="shared/bridge.js"></script>
<script src="shared/page.js"></script>
<script src="adblock.js"></script>
</body>
</html>
