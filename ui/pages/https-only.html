<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<!-- 0.15.0: the theme colour from the first frame (CSP allows exactly this block by its hash). -->
<style>html,body{background:#f3f4f6}@media (prefers-color-scheme:dark){html,body{background:#1f2023}}</style>
<title>Not secure</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="https-only.css">
</head>
<body>
<main>
  <div class="badge" aria-hidden="true">!</div>
  <h1>This site doesn’t support a secure connection</h1>
  <p>Krunk tried to load <strong id="host"></strong> over HTTPS because <em>HTTPS-only mode</em> is on, but the secure connection failed.</p>
  <p class="muted">If you continue, the page is loaded over plain HTTP. Anyone on the network could read or change it. Don’t enter passwords or payment details.</p>
  <p class="url" id="url"></p>
  <div class="buttons">
    <button id="back" class="btn primary">Go back</button>
    <button id="continue" class="btn">Continue to HTTP site</button>
  </div>
</main>
<script src="shared/bridge.js"></script>
<script src="https-only.js"></script>
</body>
</html>
