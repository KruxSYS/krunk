<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Downloads</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="shared/page.css">
<link rel="stylesheet" href="shared/dlview.css">
<link rel="stylesheet" href="downloads.css">
</head>
<body>
<div class="page dl-page">
  <div class="page-header">
    <h1>Downloads</h1>
    <input id="q" class="search" type="search" placeholder="Search downloads" aria-label="Search downloads" autocomplete="off">
    <button id="clear" class="btn" title="Removes finished, failed and cancelled downloads from the list. The files stay on disk.">Clear completed</button>
  </div>
  <div class="dl-toolbar">
    <div id="chips" class="chips" role="group" aria-label="Show">
      <button type="button" class="chip" data-filter="all" aria-pressed="true">All <span class="n"></span></button>
      <button type="button" class="chip" data-filter="active" aria-pressed="false">In progress <span class="n"></span></button>
      <button type="button" class="chip" data-filter="done" aria-pressed="false">Done <span class="n"></span></button>
      <button type="button" class="chip" data-filter="failed" aria-pressed="false">Failed <span class="n"></span></button>
    </div>
    <span id="summary" class="muted" aria-live="polite"></span>
  </div>
  <div id="list" class="vlist" role="list" aria-label="Downloads"></div>
</div>
<div id="perf" class="perf" hidden></div>
<script src="shared/bridge.js"></script>
<script src="shared/page.js"></script>
<script src="shared/dlview.js"></script>
<script src="downloads.js"></script>
</body>
</html>
