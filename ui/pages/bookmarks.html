<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<!-- 0.15.0: the theme colour from the first frame (CSP allows exactly this block by its hash). -->
<style>html,body{background:#f3f4f6}@media (prefers-color-scheme:dark){html,body{background:#1f2023}}</style>
<title>Bookmarks</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="shared/page.css">
<link rel="stylesheet" href="bookmarks.css">
</head>
<body>
<div class="page wide">
  <div class="page-header">
    <h1>Bookmarks</h1>
    <input id="q" class="search" type="search" placeholder="Search bookmarks" aria-label="Search bookmarks">
    <button id="add-folder" class="btn">New folder</button>
    <button id="import" class="btn">Import…</button>
    <button id="export" class="btn">Export…</button>
  </div>
  <div class="layout">
    <nav id="tree" class="card" aria-label="Folders"></nav>
    <section>
      <h2 id="folder-title" class="group-title"></h2>
      <div id="items" class="card"></div>
    </section>
  </div>
</div>

<dialog id="edit-dialog" aria-labelledby="edit-title">
  <form method="dialog">
    <h2 id="edit-title">Edit bookmark</h2>
    <label>Name <input type="text" id="edit-name" size="40"></label>
    <label id="edit-url-row">URL <input type="text" id="edit-url" size="40"></label>
    <label>Folder <select id="edit-folder"></select></label>
    <div class="buttons">
      <button type="button" value="cancel" class="btn">Cancel</button>
      <button value="ok" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script src="shared/bridge.js"></script>
<script src="shared/page.js"></script>
<script src="bookmarks.js"></script>
</body>
</html>
