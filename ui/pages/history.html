<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<!-- 0.15.0: the theme colour from the first frame (CSP allows exactly this block by its hash). -->
<style>html,body{background:#f3f4f6}@media (prefers-color-scheme:dark){html,body{background:#1f2023}}</style>
<title>History</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="shared/page.css">
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>History</h1>
    <input id="q" class="search" type="search" placeholder="Search history" aria-label="Search history">
    <select id="range" aria-label="Time range to delete">
      <option value="3600000">Last hour</option>
      <option value="86400000">Last 24 hours</option>
      <option value="604800000">Last 7 days</option>
      <option value="all">All time</option>
    </select>
    <button id="delete-range" class="btn">Delete</button>
    <button id="clear" class="btn">Clear browsing data…</button>
  </div>
  <div id="list"></div>
  <button id="more" class="btn more" hidden>Show more</button>
</div>

<dialog id="clear-dialog" aria-labelledby="clear-title">
  <form method="dialog" id="clear-form">
    <h2 id="clear-title">Clear browsing data</h2>
    <label>Time range
      <select id="clear-range">
        <option value="3600000">Last hour</option>
        <option value="86400000">Last 24 hours</option>
        <option value="604800000">Last 7 days</option>
        <option value="2419200000">Last 4 weeks</option>
        <option value="all" selected>All time</option>
      </select>
    </label>
    <label><input type="checkbox" id="c-history" checked> Browsing history</label>
    <label><input type="checkbox" id="c-cookies" checked> Cookies</label>
    <label><input type="checkbox" id="c-site" checked> Site data (local storage, IndexedDB, service workers)</label>
    <label><input type="checkbox" id="c-cache" checked> Cached images and files</label>
    <label><input type="checkbox" id="c-downloads"> Download list</label>
    <div class="buttons">
      <button type="button" value="cancel" class="btn">Cancel</button>
      <button value="ok" class="btn primary" id="clear-ok">Clear data</button>
    </div>
  </form>
</dialog>

<script src="shared/bridge.js"></script>
<script src="shared/page.js"></script>
<script src="history.js"></script>
</body>
</html>
