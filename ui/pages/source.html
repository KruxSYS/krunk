<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<!-- 0.15.0: the theme colour from the first frame (CSP allows exactly this block by its hash). -->
<style>html,body{background:#f3f4f6}@media (prefers-color-scheme:dark){html,body{background:#1f2023}}</style>
<title>Page source</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="shared/page.css">
<link rel="stylesheet" href="source.css">
</head>
<body>
<header class="src-bar">
  <span id="src-url" class="src-url"></span>
  <span id="src-info" class="src-info"></span>
  <span class="src-opts">
    <label class="check"><input type="checkbox" id="opt-beautify"> Beautify</label>
    <label class="check"><input type="checkbox" id="opt-wrap"> Wrap lines</label>
  </span>
</header>
<p id="src-note" class="src-note" hidden></p>
<p id="src-error" class="src-error" role="alert" hidden></p>
<main id="src" class="src" aria-label="Page source" tabindex="0"></main>
<script src="shared/bridge.js"></script>
<script src="shared/page.js"></script>
<script src="shared/jstok.js"></script>
<script src="source.js"></script>
</body>
</html>
