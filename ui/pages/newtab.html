<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<!-- 0.15.0: the theme colour from the first frame (CSP allows exactly this block by its hash). -->
<style>html,body{background:#f3f4f6}@media (prefers-color-scheme:dark){html,body{background:#1f2023}}</style>
<title>New tab</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="shared/page.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="dim" aria-hidden="true"></div>
<main>
  <form id="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search the web or type an address" aria-label="Search">
  </form>
  <div id="tiles" aria-label="Shortcuts"></div>
  <section id="keys" hidden>
    <div class="keys-head"><span>Keyboard shortcuts</span><button type="button" id="keys-hide" class="link">Hide</button></div>
    <ul id="keys-list"></ul>
  </section>
</main>
<button type="button" id="customize" class="btn" title="Customize this page">Customize</button>
<dialog id="panel">
  <form method="dialog" id="panel-form">
    <h2>Customize the new tab page</h2>
    <fieldset>
      <legend>Background</legend>
      <label><input type="radio" name="bg" value="none"> None</label>
      <label><input type="radio" name="bg" value="color"> Colour</label>
      <div class="color-row"><input type="text" id="bg-color" placeholder="#1f2937" size="8" spellcheck="false" aria-label="Background colour"></div>
      <label><input type="radio" name="bg" value="wallpaper"> Wallpaper</label>
      <div id="wallpapers" class="wallpapers" role="group" aria-label="Wallpapers"></div>
      <label><input type="radio" name="bg" value="image"> Your image <button type="button" id="pick-image" class="btn">Choose image…</button></label>
      <div class="sliders">
        <label>Dim <input type="range" id="dim-range" min="0" max="80" step="5"> <span id="dim-val"></span></label>
        <label>Blur <input type="range" id="blur-range" min="0" max="20" step="1"> <span id="blur-val"></span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Shortcut tiles</legend>
      <label><input type="radio" name="tiles" value="mostVisited"> Most visited (plus your pinned tiles)</label>
      <label><input type="radio" name="tiles" value="custom"> My own list only</label>
      <label>Columns <input type="number" id="cols" min="1" max="12"></label>
      <label>Rows <input type="number" id="rows" min="1" max="6"></label>
    </fieldset>
    <fieldset>
      <legend>Show</legend>
      <label><input type="checkbox" id="show-search"> Search box</label>
      <label><input type="checkbox" id="show-tiles"> Shortcut tiles</label>
      <label><input type="checkbox" id="show-keys"> Keyboard shortcuts</label>
    </fieldset>
    <p id="panel-error" class="field-error"></p>
    <div class="buttons"><button type="button" id="panel-close" class="btn">Done</button></div>
  </form>
</dialog>
<dialog id="tile-dialog">
  <form method="dialog" id="tile-form">
    <h2 id="tile-title">Add shortcut</h2>
    <label>Name <input type="text" id="tile-name" maxlength="64"></label>
    <label>Address <input type="text" id="tile-url" placeholder="https://example.com/" spellcheck="false"></label>
    <p id="tile-error" class="field-error"></p>
    <div class="buttons"><button type="button" id="tile-cancel" class="btn">Cancel</button><button type="submit" id="tile-save" class="btn primary">Save</button></div>
  </form>
</dialog>
<script src="shared/bridge.js"></script>
<script src="shared/colorpicker.js"></script>
<script src="shared/page.js"></script>
<script src="newtab.js"></script>
</body>
</html>
