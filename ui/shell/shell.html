<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Krunk</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-mask" viewBox="0 0 24 24"><path d="M3 10c3-2 15-2 18 0-1 5-4 6-6 4-1-1-5-1-6 0-2 2-5 1-6-4z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4M3 7v10a2 2 0 0 0 2 2h5"/><rect x="12" y="13" width="9" height="6" rx="1"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-audio-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/></symbol>
  <symbol id="i-win-min" viewBox="0 0 10 10"><path d="M0 5.5h10"/></symbol>
  <symbol id="i-win-max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1"/></symbol>
  <symbol id="i-win-restore" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7" rx="1"/><path d="M2.5 2.5V1.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1"/></symbol>
  <symbol id="i-win-close" viewBox="0 0 10 10"><path d="M.5 .5l9 9M9.5 .5l-9 9"/></symbol>
  <symbol id="i-dock-right" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></symbol>
  <symbol id="i-dock-bottom" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-agent" viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M18 15l.9 2.1 2.1.9-2.1.9L18 21l-.9-2.1-2.1-.9 2.1-.9z"/></symbol>
  <symbol id="i-macro" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h1M11 10h1M15 10h2M7 14h10"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
</svg>

<div id="tabstrip">
  <button id="tabs-left" class="tb tabs-scroll" title="Scroll tabs left" aria-label="Scroll tabs left" hidden><svg class="icon"><use href="#i-chevron-left"/></svg></button>
  <div id="tabs" role="tablist" aria-label="Tabs"></div>
  <button id="tabs-right" class="tb tabs-scroll" title="Scroll tabs right" aria-label="Scroll tabs right" hidden><svg class="icon"><use href="#i-chevron-right"/></svg></button>
  <button id="newtab" class="tb" title="New tab (Ctrl+T)" aria-label="New tab"><svg class="icon"><use href="#i-plus"/></svg></button>
  <button id="tablist" class="tb" title="All tabs" aria-label="All tabs" aria-haspopup="dialog" hidden><svg class="icon"><use href="#i-chevron-down"/></svg></button>
  <div id="drag-space"></div>
  <div id="caption" aria-label="Window">
    <button id="win-min" class="cap" tabindex="-1" title="Minimize" aria-label="Minimize"><svg class="icon"><use href="#i-win-min"/></svg></button>
    <button id="win-max" class="cap" tabindex="-1" title="Maximize" aria-label="Maximize"><svg class="icon"><use id="win-max-use" href="#i-win-max"/></svg></button>
    <button id="win-close" class="cap close" tabindex="-1" title="Close" aria-label="Close"><svg class="icon"><use href="#i-win-close"/></svg></button>
  </div>
</div>

<div id="toolbar">
  <button id="back" class="tb" title="Back (Alt+Left)" aria-label="Back" disabled><svg class="icon"><use href="#i-back"/></svg></button>
  <button id="forward" class="tb" title="Forward (Alt+Right)" aria-label="Forward" disabled><svg class="icon"><use href="#i-forward"/></svg></button>
  <button id="reload" class="tb" title="Reload (Ctrl+R)" aria-label="Reload"><svg class="icon"><use id="reload-icon" href="#i-reload"/></svg></button>
  <form id="omnibox" autocomplete="off">
    <span id="site-icon" title="Connection"><svg class="icon"><use id="site-icon-use" href="#i-info"/></svg></span>
    <span id="media-chip" class="chip media" hidden title="This page uses your camera or microphone"><svg class="icon" id="media-cam"><use href="#i-camera"/></svg><svg class="icon" id="media-mic"><use href="#i-mic"/></svg></span>
    <span id="private-badge" hidden><svg class="icon"><use href="#i-mask"/></svg>Private</span>
    <span id="address-wrap"><input id="address" type="text" spellcheck="false" placeholder="Search with DuckDuckGo or enter address" aria-label="Address and search bar"><span id="address-display" aria-hidden="true" hidden></span></span>
    <button id="key" type="button" class="tb small" title="Fill saved login" aria-label="Fill saved login" hidden><svg class="icon"><use href="#i-key"/></svg></button>
    <button id="pip" type="button" class="tb small" title="Picture-in-Picture (Alt+P)" aria-label="Picture-in-Picture" hidden><svg class="icon"><use href="#i-pip"/></svg></button>
    <button id="zoom" type="button" class="chip" title="Reset zoom (Ctrl+0)" hidden>100%</button>
    <button id="star" type="button" class="tb small" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark"><svg class="icon"><use href="#i-star"/></svg></button>
  </form>
  <form id="findbar" autocomplete="off" hidden>
    <input id="find" type="text" spellcheck="false" placeholder="Find in page" aria-label="Find in page">
    <span id="find-count" aria-live="polite"></span>
    <button type="button" id="find-prev" class="tb small" title="Previous (Shift+Enter)" aria-label="Previous match"><svg class="icon"><use href="#i-up"/></svg></button>
    <button type="button" id="find-next" class="tb small" title="Next (Enter)" aria-label="Next match"><svg class="icon"><use href="#i-down"/></svg></button>
    <button type="button" id="find-close" class="tb small" title="Close (Esc)" aria-label="Close find bar"><svg class="icon"><use href="#i-close"/></svg></button>
  </form>
  <span id="ext-actions"></span>
  <button id="downloads" class="tb" title="Downloads (Ctrl+J)" aria-label="Downloads" hidden><svg class="icon"><use href="#i-download"/></svg><span id="downloads-count" class="badge">0</span></button>
  <span id="devtools-ctl" hidden>
    <button id="dt-dock" class="tb small" title="Dock DevTools at the bottom" aria-label="Dock DevTools at the bottom"><svg class="icon"><use id="dt-dock-use" href="#i-dock-bottom"/></svg></button>
    <button id="dt-close" class="tb small" title="Close DevTools (F12)" aria-label="Close DevTools"><svg class="icon"><use href="#i-close"/></svg></button>
  </span>
  <button id="shield" class="tb" title="Ad and tracker blocking" aria-label="Shield"><svg class="icon"><use href="#i-shield"/></svg><span id="shield-count" hidden>0</span></button>
  <button id="agent" class="tb" title="AI agent (Ctrl+Shift+Space)" aria-label="AI agent" aria-pressed="false" hidden><svg class="icon"><use href="#i-agent"/></svg></button>
  <span id="macro-run" role="status" hidden><svg class="icon"><use href="#i-macro"/></svg><span id="macro-run-name"></span><button id="macro-stop" class="tb small" title="Stop the macro (Ctrl+Shift+.)" aria-label="Stop the macro"><svg class="icon"><use href="#i-stop"/></svg></button></span>
  <button id="menu" class="tb" title="Menu" aria-label="Menu"><svg class="icon"><use href="#i-menu"/></svg></button>
</div>

<div id="bookmarks-bar" role="toolbar" aria-label="Bookmarks bar" hidden></div>

<script src="shared/bridge.js"></script>
<script src="shell.js"></script>
</body>
</html>
