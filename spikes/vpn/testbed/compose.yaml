# Krunk VPN testbed (test only; never deployed). Bring up on the dind daemon:
#   docker compose -p vpn-spike up -d --build
#   docker compose -p vpn-spike exec wg cat /state/wg/client.conf
#   docker compose -p vpn-spike exec ovpn cat /state/ovpn/client-udp.ovpn   (user krunk / krunk-test)
#   docker compose -p vpn-spike down -v
# Published: 51820/udp (WireGuard), 1194/udp + 1194/tcp (OpenVPN). Reach them at dind:<port>.
# Inside network (internal, no egress): echo 10.77.0.10:80 ("client=<tunnel IP>"), DNS 10.77.0.53
# (inside.test). Tunnel subnets: WG 10.66.0.0/24, OpenVPN UDP 10.88.0.0/24, TCP 10.89.0.0/24.
name: vpn-spike

x-servers: &servers
  build: { context: ., target: servers }
  image: krunk-vpn-testbed-servers:spike
  cap_add: [NET_ADMIN]
  sysctls: { net.ipv4.ip_forward: "1" }
  volumes: [state:/state]
  restart: unless-stopped

services:
  wg:
    <<: *servers
    command: wg-entry.sh
    ports: ["51820:51820/udp"]
    networks:
      outer: {}
      inside: { ipv4_address: 10.77.0.2 }
  ovpn:
    <<: *servers
    command: ovpn-entry.sh
    devices: ["/dev/net/tun:/dev/net/tun"]
    ports: ["1194:1194/udp", "1194:1194/tcp"]
    networks:
      outer: {}
      inside: { ipv4_address: 10.77.0.3 }
  inside:
    build: { context: ., target: inside }
    image: krunk-vpn-testbed-inside:spike
    command: [inside-entry.sh, echo]
    cap_add: [NET_ADMIN]
    networks: { inside: { ipv4_address: 10.77.0.10 } }
    restart: unless-stopped
  dns:
    image: krunk-vpn-testbed-inside:spike
    command: [inside-entry.sh, dns]
    cap_add: [NET_ADMIN]
    depends_on: [inside]
    networks: { inside: { ipv4_address: 10.77.0.53 } }
    restart: unless-stopped

networks:
  outer: {}
  inside:
    internal: true
    # Docker drops forwarded traffic on internal networks whose source is outside the network's
    # subnet (DOCKER-INTERNAL chain). The subnet therefore spans the tunnel ranges (10.64/11
    # covers 10.66, 10.77, 10.88, 10.89) while containers get addresses from 10.77.0.0/24 only;
    # the /24 routes to the tunnel subnets win over the /11 on-link route.
    ipam: { config: [{ subnet: 10.64.0.0/11, ip_range: 10.77.0.0/24 }] }

volumes:
  state: {}
