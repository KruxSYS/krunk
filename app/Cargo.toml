[package]
name = "app"
description = "Krunk Windows host (CEF)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

# Krunk.dll, loaded by Krunk.exe (CEF's renamed sandbox
# bootstrap.exe) for the browser process and every subprocess.
[lib]
name = "Krunk"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# The update check also accepts http:// servers (local update-flow tests only;
# scripts/build-dist.sh --dev, output in target/dev-dist/, never dist/).
dev-updates = []
# KRUNK_PERF_OFF=media,login,... switches page scripts (and `cdp`: the per-tab DevTools domains)
# off, to measure what each costs (Speedometer, R24). scripts/build-dist.sh --probe only, never
# in a release.
perf-probe = []
# KRUNK_DEVTOOLS_PORT=<port> opens the engine's DevTools port on 127.0.0.1 (test harness:
# console and network of every target). scripts/build-dist.sh --fast only, never in a release.
devtools-port = []

[dependencies]
lb_core = { path = "../core", package = "core" }
serde = "1"
serde_json = "1"
url = "2"
zeroize = "1.8"
# 0.12.0: screenshots from DevTools come as base64.
base64ct = { version = "1.8", features = ["alloc"] }
# Custom DNS (0.6.0): the loopback DoH stub and its upstream transports (no system DNS).
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
hickory-net = { version = "0.26.3", default-features = false, features = ["tokio", "https-ring", "quic-ring", "h3-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
ring = "0.17"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2"] }
http-body-util = "0.1"
webpki-roots = "0.26"
# 0.14.0: the in-browser VPN (WireGuard, OpenVPN; a local proxy for Krunk's traffic only).
vpn = { path = "../vpn" }

[target.'cfg(windows)'.dependencies]
# Pinned exactly: the binary distribution in cef.lock must match this crate.
cef = { version = "=156.3.0", default-features = false, features = ["sandbox"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_Threading",
] }
