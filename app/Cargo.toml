[package]
name = "app"
description = "Krunk Windows host (CEF)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

# Krunk.dll, loaded by Krunk.exe (CEF's renamed sandbox
# bootstrap.exe) for the browser process and every subprocess.
[lib]
name = "Krunk"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
lb_core = { path = "../core", package = "core" }
serde = "1"
serde_json = "1"
url = "2"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
# Pinned exactly: the binary distribution in cef.lock must match this crate.
cef = { version = "=156.3.0", default-features = false, features = ["sandbox"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_Threading",
] }
