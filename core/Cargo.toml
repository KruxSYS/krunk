[package]
name = "core"
description = "Platform-independent logic for LightBrowser (storage, vault crypto, adblock, settings, protocol)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Not "core": that would shadow the built-in `core` crate that derive macros reference.
name = "lb_core"
path = "src/lib.rs"

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.8", features = ["std"] }
getrandom = "0.4"
base64ct = { version = "1.8", features = ["alloc"] }

[build-dependencies]
miniz_oxide = "0.9"
