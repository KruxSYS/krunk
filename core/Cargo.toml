[package]
name = "core"
description = "Platform-independent logic for Krunk (storage, vault crypto, adblock, settings, protocol)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Not "core": that would shadow the built-in `core` crate that derive macros reference.
name = "lb_core"
path = "src/lib.rs"

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
psl = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.8", features = ["std"] }
getrandom = "0.4"
base64ct = { version = "1.8", features = ["alloc"] }
# Update check: verify-only Ed25519, download hash, version order.
ed25519-dalek = { version = "3", default-features = false }
sha2 = "0.11"
semver = "1"
# Sync crypto (docs/sync/PROTOCOL.md §2): exact pins; hpke's dependencies are the same
# RustCrypto generation as chacha20poly1305 0.11 / sha2 0.11 / curve25519-dalek 5.
hkdf = "=0.13.0"
hmac = "=0.13.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets", "zeroize"] }
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
des = "0.9"
pbkdf2 = "0.13"
sha1 = "0.11"
aes-gcm = "0.11"
bip39 = { version = "3", default-features = false, features = ["std"] }

[dev-dependencies]
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }

[build-dependencies]
miniz_oxide = "0.9"
