[package]
name = "core"
description = "Platform-independent logic for LightBrowser (storage, vault crypto, adblock, settings, protocol)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Not "core": that would shadow the built-in `core` crate that derive macros reference.
name = "lb_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
