[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 1

# Optimize dependencies in dev/test builds: Argon2 with 64 MiB and compiling
# the full filter lists are painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
