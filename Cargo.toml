[workspace]
resolver = "2"
members = ["core", "app", "vpn", "ffi"]
# The account and sync API is its own workspace (server/Cargo.toml). vendor/ holds the VPN's
# vendored crates (vendor/README.md): path dependencies of vpn, not members (no workspace lints
# or fmt on upstream code).
exclude = ["server", "vendor"]

[workspace.package]
version = "0.30.1"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 1

# Test builds for the VM (scripts/build-dist.sh --fast): the release settings without
# whole-program LTO, on every core and incremental. A change in app/ rebuilds in about a
# minute instead of the release build's ten. Never shipped.
[profile.fast]
inherits = "release"
lto = false
opt-level = 1
codegen-units = 256
incremental = true

# Optimize dependencies in dev/test builds: Argon2 with 64 MiB and compiling
# the full filter lists are painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
