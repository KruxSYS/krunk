# krunk-sync: the Krunk account and sync API (docs/sync/PLAN.md §4). It is its own workspace,
# so the browser workspace, its Windows builds and its lockfile stay independent.
[workspace]

[package]
name = "krunk-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"
publish = false

[[bin]]
name = "krunk-sync"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
base64ct = { version = "1.8", features = ["alloc"] }
# S2: accounts (PLAN §4.2). Password hashing, peppers, token hashes and TOTP.
argon2 = "0.6"
hmac = "=0.13.0"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
# Outbound TLS (Turnstile siteverify, SMTP): rustls with the ring provider and the system roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }

[dev-dependencies]
# The mock siteverify in turnstile.rs reads form bodies.
axum = { version = "=0.8.9", default-features = false, features = ["form"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
