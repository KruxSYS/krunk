<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Krunk 0.28.0 embeds fixture</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; }
  section { margin-bottom: 24px; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  iframe { border: 1px solid #999; display: block; }
</style>
</head>
<body>
<h1>Embeds fixture (Strict: video plays, social embeds show the placeholder)</h1>

<section id="youtube">
  <h2>1. YouTube embed (video: should play on Strict, origin referrer)</h2>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/aqz-KE-bpKQ"
    title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
</section>

<section id="twitter">
  <h2>2. Twitter/X embed (social: placeholder on Strict)</h2>
  <iframe width="550" height="300" src="https://platform.twitter.com/embed/Tweet.html?id=20" title="Tweet"></iframe>
</section>

<section id="facebook">
  <h2>3. Facebook plugin (social: placeholder on Strict)</h2>
  <iframe width="500" height="300"
    src="https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F20531316728%2Fposts%2F10154009990506729%2F"
    title="Facebook post"></iframe>
</section>
</body>
</html>
