<!doctype html><html><head><meta charset="utf-8"><title>ua probe</title></head><body>
<pre id="o" style="font:14px monospace;white-space:pre-wrap"></pre>
<script>
(async()=>{
 const o=[];o.push('navigator.userAgent = '+navigator.userAgent);
 o.push('navigator.platform = '+navigator.platform);
 o.push('navigator.language = '+navigator.language);
 const d=navigator.userAgentData;
 if(d){o.push('userAgentData.platform = '+d.platform);o.push('brands = '+JSON.stringify(d.brands));
  try{const h=await d.getHighEntropyValues(['architecture','bitness','model','platformVersion','uaFullVersion','fullVersionList','wow64']);o.push('highEntropy = '+JSON.stringify(h));}catch(e){o.push('highEntropy error '+e)}}
 else o.push('userAgentData missing');
 o.push('typeof __lbHost = '+typeof __lbHost+' ("__lbHost" in window: '+('__lbHost' in window)+')');
 let hdr={};try{hdr=await (await fetch('/headers',{cache:'no-store',headers:{'X-Page-Header':'secret'}})).json();}catch(e){o.push('headers fetch error '+e)}
 o.push('--- request headers seen by the server (fetch) ---');
 for(const k of Object.keys(hdr).sort())o.push(k+': '+hdr[k]);
 document.getElementById('o').textContent=o.join('\n');
 document.title='UA '+(d?d.platform:'?')+' | hdr '+(hdr['Sec-CH-UA-Platform']||hdr['sec-ch-ua-platform']||'none');
 fetch('/log?ua='+encodeURIComponent(JSON.stringify({js:d&&d.platform,hdr:hdr['Sec-CH-UA-Platform'],ua:hdr['User-Agent'],al:hdr['Accept-Language']})));
})();
</script></body></html>
