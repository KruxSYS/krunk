<!doctype html>
<!-- User-agent echo page (Krunk 0.5.0, scripts/vm-050-settings.ps1): shows navigator.userAgent
     and the client-hint brands in large text, and reports them to the test server's log. -->
<html lang="en"><head><meta charset="utf-8"><title>User agent echo</title>
<style>body { font: 18px system-ui, sans-serif; margin: 24px; } code { display: block; font-size: 20px; word-break: break-all; margin: 8px 0 20px; }</style>
</head><body>
<p>navigator.userAgent</p><code id="ua"></code>
<p>navigator.userAgentData.brands</p><code id="brands"></code>
<script>
  document.getElementById('ua').textContent = navigator.userAgent;
  document.getElementById('brands').textContent = navigator.userAgentData ? JSON.stringify(navigator.userAgentData.brands) : '(none)';
  fetch('/log?ua=' + encodeURIComponent(navigator.userAgent), { cache: 'no-store' }).catch(() => {});
</script>
</body></html>
