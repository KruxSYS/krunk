<!doctype html>
<!-- Password suggestion test (Krunk 0.5.0, scripts/vm-050-autofill.ps1): a login form at the
     top level (localhost:8094) and a cross-origin one in an iframe (127.0.0.1:8095). Both report
     what their fields contain so the test can prove nothing was filled before the user chose. -->
<html lang="en"><head><meta charset="utf-8"><title>Login test</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 24px; }
  input { font: inherit; padding: 6px 8px; width: 260px; display: block; margin: 6px 0 14px; }
  iframe { width: 420px; height: 240px; border: 2px solid #888; margin-top: 10px; }
  #state { font-family: ui-monospace, monospace; color: #555; }
</style></head><body>
<h1>Top-level login (localhost:8094)</h1>
<form id="f" action="/log" method="get">
  <label>Username <input id="user" name="username" type="text" autocomplete="username"></label>
  <label>Password <input id="pw" name="password" type="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<p id="state"></p>
<p id="events">events: none</p>
<h2>Cross-origin iframe (127.0.0.1:8095)</h2>
<iframe src="http://127.0.0.1:8095/frame-login.html"></iframe>
<script>
  function show() {
    document.getElementById('state').textContent = 'top: user="' + document.getElementById('user').value + '" password-length=' + document.getElementById('pw').value.length;
  }
  ['input', 'change', 'focus', 'blur'].forEach((ev) => document.addEventListener(ev, show, true));
  // Every input/change event with the field and its value length: a fill must fire both.
  var events = [];
  ['input', 'change'].forEach((ev) => document.addEventListener(ev, (e) => {
    events.push(ev + '#' + e.target.id + '(' + e.target.value.length + ')');
    document.getElementById('events').textContent = 'events: ' + events.join(' ');
  }, true));
  setInterval(show, 500);
  show();
</script>
</body></html>
