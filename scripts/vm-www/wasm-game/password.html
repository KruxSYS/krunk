<!doctype html>
<!-- The WASM inspector's check of the agent tools' refusal: the game in a frame next to a
     password field that holds a value. The wasm_* tools must be refused here (what they read
     goes to the model's provider); krunk://wasm and GM.wasm are not. -->
<html><head><meta charset="utf-8"><title>WASM game with a password field</title>
<style>body { font: 16px "Segoe UI", sans-serif; margin: 16px; } iframe { width: 760px; height: 420px; border: 1px solid #999; }</style></head><body>
<form onsubmit="return false"><label>Password <input type="password" id="pw" value="hunter2-test"></label></form>
<iframe src="index.html?pw"></iframe>
</body></html>
