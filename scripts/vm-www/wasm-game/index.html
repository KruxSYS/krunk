<!doctype html>
<!-- The WASM memory inspector's test game (Krunk 0.19.0). game.wasm keeps health (i32), score
     (f32) and gold (i32, behind a pointer) in its linear memory; the page shows them every
     100 ms, so a value changed or frozen in memory shows up here. `?worker` runs the module in
     a dedicated worker instead (the page only displays what the worker reports).
     "Grow memory" calls memory.grow(1) inside the module and puts 4242 sixteen bytes into the new
     page (an address that did not exist before). The module exports a mutable global
     (__stack_pointer) and an immutable one (VERSION, the address of an i32 that is 19).
     The title carries the values for scripted checks:
     "WASM health=100 score=0 gold=250 pages=17 marker=0 sp=1048576". -->
<html><head><meta charset="utf-8"><title>WASM game</title>
<style>
  body { font: 18px "Segoe UI", sans-serif; margin: 32px; }
  .v { font: bold 32px ui-monospace, Consolas, monospace; }
  button { font: inherit; margin-right: 8px; padding: 4px 12px; }
  #where { color: #555; }
</style></head><body>
<h1>WASM game</h1>
<p id="where"></p>
<p>Health <span class="v" id="health">?</span> &nbsp; Score <span class="v" id="score">?</span> &nbsp; Gold <span class="v" id="gold">?</span></p>
<p><button id="hit">Hit (−10)</button><button id="heal">Heal (+5)</button><button id="pts">Score +1.5</button><button id="spend">Spend 20 gold</button></p>
<p>Memory <span class="v" id="pages">?</span> pages &nbsp; Marker in the newest page <span class="v" id="marker">?</span></p>
<p><button id="grow">Grow memory (+1 page)</button></p>
<p>Global <code>__stack_pointer</code> <span class="v" id="sp">?</span></p>
<script src="game.js"></script>
</body></html>
