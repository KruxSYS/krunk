# The WASM memory inspector's test app (Krunk 0.19.0): a tiny "game" whose state lives in
# linear memory. Its own workspace, outside Krunk's. Build: ./build.sh (needs the
# wasm32-unknown-unknown target); the result game.wasm is committed.
[package]
name = "wasm-game"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
