<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pointer lock measure</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
  #stage { position: absolute; inset: 0 0 120px 0; background: #1d2b1d; display: grid; place-items: center; font-size: 28px; }
  #out { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; margin: 0; padding: 8px; overflow: auto; font: 12px monospace; }
</style></head>
<body>
<!-- Krunk 0.4.0: measures pointer-lock movement delivery. Click the stage to lock (?unadjusted=1
     for raw movement). For ?ms= milliseconds after the lock it records every mousemove,
     pointermove and pointerrawupdate on the stage (time, movementX/Y, isTrusted) and the movement
     summed per animation frame, then reports statistics: on screen, in the title, and as a GET
     to /plock-result?... (the test server logs it). -->
<div id="stage">click to lock</div>
<pre id="out"></pre>
<script>
  const q = new URLSearchParams(location.search);
  const DURATION = Number(q.get('ms') || 3000);
  const label = q.get('label') || 'run';
  const stage = document.getElementById('stage');
  const out = document.getElementById('out');
  let rec = null;
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  stage.addEventListener('click', () => {
    stage.requestPointerLock(q.get('unadjusted') ? { unadjustedMovement: true } : undefined);
  });
  function onMove(e) {
    if (!rec) return;
    rec.events.push([e.type, e.timeStamp, e.movementX, e.movementY, e.isTrusted ? 1 : 0]);
    if (e.type === 'mousemove') { rec.frameX += e.movementX; rec.frameY += e.movementY; }
  }
  // Which events the "game" listens to (?listen=mousemove,pointermove,pointerrawupdate).
  const listen = (q.get('listen') || 'mousemove').split(',');
  for (const t of listen) stage.addEventListener(t, onMove);
  function frame(ts) {
    if (!rec) return;
    rec.frames.push([ts, rec.frameX, rec.frameY]);
    rec.frameX = 0; rec.frameY = 0;
    if (ts - rec.start < DURATION) requestAnimationFrame(frame); else finish();
  }
  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement === stage && !rec) {
      stage.textContent = 'LOCKED: recording';
      rec = { start: performance.now(), events: [], frames: [], frameX: 0, frameY: 0 };
      requestAnimationFrame(frame);
    }
  });
  function stats(a) {
    const n = a.length; if (!n) return { n: 0 };
    const mean = a.reduce((s, v) => s + v, 0) / n;
    const sd = Math.sqrt(a.reduce((s, v) => s + (v - mean) ** 2, 0) / n);
    return { n, mean: +mean.toFixed(2), sd: +sd.toFixed(2), cv: mean ? +(sd / Math.abs(mean)).toFixed(3) : null, min: Math.min(...a), max: Math.max(...a) };
  }
  function finish() {
    const r = rec; rec = null;
    document.exitPointerLock();
    // Frames while the mouse moved: from the first to the last frame with movement.
    const xs = r.frames.map((f) => f[1]);
    const first = xs.findIndex((v) => v !== 0), last = xs.length - 1 - [...xs].reverse().findIndex((v) => v !== 0);
    const active = first < 0 ? [] : xs.slice(first, last + 1);
    const mm = r.events.filter((e) => e[0] === 'mousemove');
    const gaps = [];
    for (let i = 1; i < mm.length; i++) gaps.push(+(mm[i][1] - mm[i - 1][1]).toFixed(1));
    const res = {
      label,
      listen: listen.join('+'),
      unadjusted: !!q.get('unadjusted'),
      frames: active.length,
      perFrameX: stats(active),
      zeroFrames: active.filter((v) => v === 0).length,
      negativeFrames: active.filter((v) => v < 0).length,
      bigFrames: active.filter((v) => v > 2 * (active.reduce((s, v) => s + v, 0) / Math.max(1, active.length))).length,
      totalX: xs.reduce((s, v) => s + v, 0),
      mousemoves: mm.length,
      trusted: mm.filter((e) => e[4]).length,
      synthetic: mm.filter((e) => !e[4]).length,
      zeroMoves: mm.filter((e) => e[2] === 0 && e[3] === 0).length,
      maxGapMs: gaps.length ? Math.max(...gaps) : 0,
      gapsOver40ms: gaps.filter((g) => g > 40).length,
      seriesX: active.slice(0, 120),
    };
    const json = JSON.stringify(res);
    out.textContent = json;
    document.title = 'done ' + label;
    stage.textContent = 'done: ' + label;
    new Image().src = '/plock-result?' + encodeURIComponent(json);
  }
</script>
</body></html>
